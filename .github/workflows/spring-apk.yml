# Save as .github/workflows/spring-apk.yml in your repo.
# The APK is 158 MB, over GitHub's 100 MB file limit, so host it somewhere
# (a Release asset, Drive/Dropbox direct link) and pass the URL as an input.
name: Spring APK inspect/patch

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct download URL of Spring-0_8-Preview-1.apk
        required: true
      patch:
        description: Apply patches/theme.patch, rebuild and sign
        type: boolean
        default: false

env:
  APKTOOL: 2.9.3

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get apktool and the APK
        run: |
          curl -L -o apktool.jar "https://github.com/iBotPeaches/apktool/releases/download/v${APKTOOL}/apktool_${APKTOOL}.jar"
          curl -L -o spring.apk "${{ inputs.apk_url }}"
          ls -lh spring.apk

      - name: Decode
        run: java -jar apktool.jar d -f spring.apk -o out

      - name: Collect findings
        run: |
          mkdir findings
          for k in ANDROID_4 Android4Controller bootAndroid4 SpringGate "Spring restarts to switch"; do
            grep -rn --include='*.smali' -F "$k" out > "findings/$(echo "$k" | tr ' ' '_').txt" || true
          done
          wc -l findings/*
          # smali only (no assets) so the artifact stays small
          tar czf findings/smali.tar.gz -C out $(cd out && ls -d smali*)

      - uses: actions/upload-artifact@v4
        with:
          name: findings
          path: findings

      - name: Apply patch
        if: ${{ inputs.patch }}
        run: git apply --directory=out --verbose patches/theme.patch

      - name: Rebuild and sign
        if: ${{ inputs.patch }}
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore k.jks -storepass android -keypass android \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Local"
          $BT/apksigner sign --ks k.jks --ks-pass pass:android --key-pass pass:android \
            --out Spring-patched.apk aligned.apk

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.patch }}
        with:
          name: Spring-patched
          path: Spring-patched.apk
