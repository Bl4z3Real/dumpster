name: Estrai Network Hosts da APK

# Salva come .github/workflows/estrai-api-da-apk.yml
# Poi: Actions > "Estrai Network Hosts da APK" > Run workflow
# Output: artifact "network-hosts" con un solo file, network_hosts.txt

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Percorso dell'APK nel repo (es. app.apk)"
        required: false
        default: "app.apk"
      apk_url:
        description: "Oppure URL diretto all'APK (ha la precedenza)"
        required: false
        default: ""

jobs:
  hosts:
    runs-on: ubuntu-latest
    env:
      APK_PATH: ${{ inputs.apk_path }}
      APK_URL: ${{ inputs.apk_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara APK
        run: |
          if [ -n "$APK_URL" ]; then
            curl -fL -o target.apk "$APK_URL"
          else
            cp "$APK_PATH" target.apk
          fi

      - name: Installa jadx e apktool
        run: |
          mkdir -p tools
          curl -fsL -o tools/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q tools/jadx.zip -d tools/jadx
          curl -fsL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Decompila
        run: |
          tools/jadx/bin/jadx -d out/jadx --show-bad-code target.apk || true
          java -jar tools/apktool.jar d -f -o out/apktool target.apk

      - name: Estrai solo i Network Hosts
        run: |
          mkdir -p report
          python3 - <<'PY'
          import os, re

          noise = re.compile(
              r"(schemas\.android\.com|w3\.org|apache\.org|xmlpull\.org|"
              r"developer\.android\.com|ns\.adobe\.com|example\.(com|org)|"
              r"localhost|\.(png|jpg|gif|js|css|xml|java|kt)$)"
          )
          valid = re.compile(r"^(?:[a-z0-9-]+\.)+[a-z]{2,}$|^\d{1,3}(?:\.\d{1,3}){3}$")

          url_re = re.compile(rb"https?://(?:[^/\s\"'<>@]*@)?([A-Za-z0-9.-]+)")
          man_re = re.compile(rb'android:host="([A-Za-z0-9.*-]+)"')
          nsc_re = re.compile(rb"<domain[^>]*>([A-Za-z0-9.-]+)</domain>")

          hosts = set()
          for root in ("out/jadx", "out/apktool"):
              for dp, _, files in os.walk(root):
                  for fn in files:
                      p = os.path.join(dp, fn)
                      try:
                          if os.path.getsize(p) > 60_000_000:
                              continue
                          data = open(p, "rb").read()
                      except OSError:
                          continue
                      for rx in (url_re, man_re, nsc_re):
                          for m in rx.findall(data):
                              h = m.decode("ascii", "ignore").lower().strip(".-*")
                              if valid.match(h) and not noise.search(h):
                                  hosts.add(h)

          with open("report/network_hosts.txt", "w") as f:
              f.write("\n".join(sorted(hosts)) + "\n")
          print(f"{len(hosts)} host trovati")
          PY
          cat report/network_hosts.txt
          { echo '```'; cat report/network_hosts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: network-hosts
          path: report/network_hosts.txt
          retention-days: 7
